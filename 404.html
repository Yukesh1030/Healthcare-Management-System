<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — STACKLY Healthcare</title>
  <meta name="description" content="The medical page or resource you requested could not be located. Return to STACKLY Healthcare home or use our clinical directory.">
  
  <!-- Google Fonts: DM Serif Display & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <main>
    <!-- =======================================================================
         CUSTOM 404 SECTION
         Options of "Back" and "Back to Home" with relevant GSAP animations
         ======================================================================= -->
    <section class="error-404-section" id="error-section">
      <div class="error-404-card" id="error-card">
        <div class="error-brand" id="error-brand">
          <a href="index.html" class="brand-link" aria-label="Return to STACKLY Healthcare Home">
            <img src="Assets/Brand-logo.webp" alt="STACKLY Healthcare Logo" class="brand-logo-img" width="160" height="38">
          </a>
        </div>

        <div class="error-pulse-icon" id="error-icon">
          <i class="fa-solid fa-stethoscope"></i>
        </div>

        <div class="error-code-badge" id="error-code">404</div>

        <h1 class="serif-heading" id="error-title" style="font-size: 2.2rem; margin-bottom: 12px; color: var(--primary);">
          Clinical Route Not Found
        </h1>

        <p id="error-desc" style="font-size: 1.05rem; color: var(--primary-muted); max-width: 520px; margin: 0 auto 20px auto; line-height: 1.7;">
          The page or medical file you are looking for has been moved, relocated, or is currently under scheduled coordination.
        </p>

        <!-- Options of "Back" and "Back to Home" -->
        <div class="error-actions-group" id="error-actions">
          <button type="button" class="btn btn-outline" id="btn-history-back" onclick="window.history.length > 1 ? window.history.back() : window.location.href='index.html'">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back</span>
          </button>
          
          <a href="index.html" class="btn btn-primary" id="btn-back-home">
            <i class="fa-solid fa-house-medical"></i>
            <span>Back to Home</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <!-- GSAP & ScrollTrigger from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>

  <!-- 404 Specific GSAP Animations -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof gsap !== 'undefined') {
        const tl = gsap.timeline({ defaults: { ease: 'back.out(1.7)' } });
        tl.from('#error-card', { scale: 0.85, opacity: 0, duration: 0.8 })
          .from('#error-brand', { y: -15, opacity: 0, duration: 0.5 }, '-=0.5')
          .from('#error-icon', { scale: 0, rotation: -45, duration: 0.6 }, '-=0.4')
          .from('#error-code', { y: 30, opacity: 0, duration: 0.7 }, '-=0.3')
          .from('#error-title', { y: 20, opacity: 0, duration: 0.5 }, '-=0.4')
          .from('#error-desc', { y: 15, opacity: 0, duration: 0.5 }, '-=0.3')
          .from('#error-actions', { y: 20, opacity: 0, duration: 0.6 }, '-=0.2');

        // Continuous medical stethoscope swing & pulse
        gsap.to('#error-icon i', {
          rotation: 10,
          scale: 1.15,
          duration: 1.1,
          repeat: -1,
          yoyo: true,
          ease: 'power1.inOut'
        });

        // Interactive button hover physics
        const actionBtns = document.querySelectorAll('#error-actions button, #error-actions a');
        actionBtns.forEach(btn => {
          btn.addEventListener('mouseenter', () => gsap.to(btn, { scale: 1.04, duration: 0.2, ease: 'power1.out' }));
          btn.addEventListener('mouseleave', () => gsap.to(btn, { scale: 1, duration: 0.25, ease: 'power1.out' }));
        });
      }
    });
  </script>
</body>
</html>
